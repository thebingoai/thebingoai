[project]
name = "bingo"
version = "0.1.0"
description = "An open-source BI platform with AI-powered dashboards, real-time chat, and multi-database connectivity. FastAPI + Nuxt 4 + LangGraph."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "The Bingo AI" }]
urls = { Homepage = "https://thebingo.ai", Repository = "https://github.com/thebingoai/thebingoai" }

[tool.pytest.ini_options]
minversion = "7.0"
# CI runs exactly this (see .github/workflows/backend-tests.yml). The top-level
# tests/ tree is legacy and ungated; listing it here only made the config lie.
testpaths = ["backend/tests"]
# Repo root only — never backend/, which would shadow langgraph (see addopts).
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    # Keeps backend/ off sys.path: backend/langgraph/ would shadow the real
    # langgraph distribution, breaking collection for the whole suite.
    "--import-mode=importlib",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "asyncio: async tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
